# XcodeGen 工程描述。
#
# 用它而不是把 .xcodeproj 提交进仓库：pbxproj 是一坨带 UUID 的生成物，合并冲突极其难处理，
# 而且 llama.xcframework 是 CI 现场编出来的，路径要在生成时才确定。
#
#   brew install xcodegen && xcodegen generate
name: QW

options:
  bundleIdPrefix: io.argoodies
  deploymentTarget:
    # llama.cpp 的 xcframework 自己就是按 16.4 编的，不能再往下调。
    iOS: "16.4"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: none

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"

settings:
  base:
    # 语言模式，不是编译器版本 —— 只接受 4 / 4.2 / 5 / 6。
    # 停在 5：这套代码用的是 Swift 5 的并发规则，切到 6 会因为严格 Sendable 检查大面积报错。
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9TGD35M5GT"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  QW:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        # 显式指定，免得 .gguf 这种没人认识的扩展名被归错 build phase。
        # Model/ 下的权重由 scripts/fetch-model.sh 提前拉好，会跟着一起打包。
        buildPhase: resources
        excludes:
          # Info.plist 走 INFOPLIST_FILE，不能同时作为资源被拷进 bundle。
          - Info.plist
    dependencies:
      # CI 在这一步之前跑 scripts/build-llama-xcframework.sh 生成它。
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        # 复用 App Store Connect 上已有的那条记录（app 6815647930）。
        # 这串是当初用 Expo 建 App 时自动生成的占位 identifier，难看但已经注册好了；
        # 该记录还没有任何构建，真想换成 io.argoodies.* 只能去网页端改，API 改不了 bundleId。
        PRODUCT_BUNDLE_IDENTIFIER: dev.expo.client.cdk6asipshwbwfmintawzxd2uwcbu5iejxt3t4gqkoq4o
        PRODUCT_NAME: QW
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 只做 iPad。iPhone 上装不了 —— 这个 app 是按大屏设计的。
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
