name: Build & TestFlight

# 一条流水线走完：编译 → 归档 → 上传 TestFlight。仍然是一个文件、一套缓存，
# 但只有手动触发才会真的发布。
#
# 起初是推到 main 就出包，结果当天上传二十多次，撞上了 App Store Connect 的每日
# 上传配额（409 Upload limit reached），三条流水线连着挂在上传那一步。发布次数
# 该由「这版值得发」决定，而不是由「刚好推了一次」决定。
#
# push 和 PR 都只做编译验证，不签名也不上传。
#
# 必须用 macos-15（Xcode 26 / iOS 26 SDK），旧 SDK 会被 App Store Connect 直接退回。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 归档并上传 TestFlight
        type: boolean
        default: true
      distribute:
        description: 导出 ad-hoc 包并发布到 Fly 下载页
        type: boolean
        default: false

env:
  # 必须和 scripts/build-llama-xcframework.sh 里的默认值一致，否则缓存会认错版本。
  LLAMA_REF: b11158
  MODEL_KEY: Qwen3.5-0.8B-Q4_K_M
  TEAM_ID: "9TGD35M5GT"
  SCHEME: QW

jobs:
  build:
    name: 编译并发布
    runs-on: macos-15
    env:
      # 上 TestFlight 和出 ad-hoc 下载包都要先归档，而一次归档够两边导出用。
      NEEDS_ARCHIVE: ${{ github.event_name == 'workflow_dispatch' && (inputs.release || inputs.distribute) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -eo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app | sed 's#.*/Xcode_##;s#.app##' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/Xcode_${LATEST}.app/Contents/Developer"
          xcodebuild -version

      # 从源码编 llama.cpp 要十来分钟，只有升级 LLAMA_REF 时才需要重来一次。
      # 用 restore + save 而不是 actions/cache：后者只在 job 成功时才写缓存，
      # 于是一个 Swift 编译错误就会让前面十几分钟的构建白做，每次重试都重来。
      - name: Restore llama.xcframework
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_REF }}-${{ runner.os }}

      - name: Build llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Save llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_REF }}-${{ runner.os }}

      # 模型权重不在仓库里（507 MB，超过 GitHub 单文件上限），构建前现拉一份。
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: Resources/Model
          key: model-${{ env.MODEL_KEY }}

      - name: Fetch model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model.sh

      - name: Save model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Resources/Model
          key: model-${{ env.MODEL_KEY }}

      - name: Generate Xcode project
        run: |
          set -eo pipefail
          brew install xcodegen
          xcodegen generate

      # 不发布的时候就验证能不能编译。归档本身也会编译一遍，所以真要发布时跳过这步。
      - name: Build (simulator)
        if: env.NEEDS_ARCHIVE != 'true'
        run: |
          set -eo pipefail
          xcodebuild build \
            -project QW.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Write App Store Connect API key
        if: env.NEEDS_ARCHIVE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # 每次归档都会新建一张 "Created via API" 开发证书，配额满了归档就直接失败。
      # 归档前先清掉上次留下的 —— 下面那步需要时会重新建一张。
      - name: Revoke stale CI certificates
        if: env.NEEDS_ARCHIVE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" scripts/revoke-stale-certs.py

      - name: Archive
        if: env.NEEDS_ARCHIVE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          # build 号跟随 run_number 单调递增，避免和 TestFlight 上已有的构建撞号。
          BUILD_NUM=${{ github.run_number }}

          xcodebuild archive \
            -project QW.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QW.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export .ipa (App Store)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QW.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          # altool 遇到 409 之类的错误仍然 exit 0，只把 ERROR 打到 stdout，必须解析日志才知道成败。
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if grep -qiE 'ERROR:|Validation failed' "$RUNNER_TEMP/altool.log"; then
            echo "::error::上传 App Store Connect 失败（详见上方 Validation 日志）"
            exit 1
          fi

      # 下面是另一条出口：不走 TestFlight，导一个 ad-hoc 包挂到自己的下载页上。
      # 用的是同一个 archive —— 签名方式是导出时才定的，归档不用重来。
      #
      # 必须是 ad-hoc 而不是 app-store：后者导出的包下载下来装不上，iOS 只认
      # App Store 和 TestFlight 这两个来源。ad-hoc 能装，代价是只认开发者账号里
      # 登记过的设备，换台没登记的手机点安装会直接失败。
      - name: Export .ipa (ad-hoc)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          cat > "$RUNNER_TEMP/ExportOptionsAdHoc.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QW.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-adhoc" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsAdHoc.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish install page to Fly
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::缺少仓库 Secret FLY_API_TOKEN"
            exit 1
          fi

          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"

          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' distribution/fly.toml)
          HOST="${APP}.fly.dev"
          IPA=$(find "$RUNNER_TEMP/export-adhoc" -name "*.ipa" | head -1)

          ./scripts/make-install-site.sh "$IPA" "$HOST" "${{ github.run_number }}"

          flyctl apps create "$APP" --org personal 2>/dev/null || true
          flyctl deploy distribution \
            --config distribution/fly.toml \
            --remote-only --ha=false

          echo "::notice::安装页 https://${HOST}"
          echo "### 安装页 https://${HOST}" >> "$GITHUB_STEP_SUMMARY"
