# 分发页：一台 nginx，把 CI 导出的 ad-hoc .ipa 和 OTA 清单摆出来。
#
# 这里故意没有 app 名。这页不设密码 —— itms-services 取清单时不带凭据，加了
# 认证 iOS 就装不了 —— 所以「不可猜的主机名」是它仅有的一层遮挡，而这是个公开
# 仓库，名字写在这儿等于没遮。名字放在仓库 Secret `FLY_APP_NAME` 里，部署时用
# `--app` 传进去。
#
# 就算名字漏了也不是灾难：ad-hoc 描述文件只认开发者账号里登记过的那几台设备，
# 别人下到的 .ipa 装不上。遮挡挡的是「谁都能下走这半个 G」，不是「谁都能装」。
primary_region = "lax"

[build]

[http_service]
  internal_port = 80
  force_https = true
  # 平时没人下载就停机，点进来再拉起。500 多 MB 的包放着不动不该一直烧机器。
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
