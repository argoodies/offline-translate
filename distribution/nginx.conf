server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OTA 安装分两步：iOS 先取 manifest.plist，再按里面的地址拉 .ipa。
    # 两者的 Content-Type 都得对，尤其是清单 —— 发成 text/plain 的话
    # iOS 会一声不吭地失败，只弹一句「无法安装」。
    location = /manifest.plist {
        default_type application/xml;
        add_header Cache-Control "no-store";
    }

    location ~ \.ipa$ {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="QW.ipa"';
        # 半个 G 的包，断了能接着下。
        add_header Accept-Ranges bytes;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
